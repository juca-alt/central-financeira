<link rel="manifest" href="manifest.webmanifest" />
<script>
  /* Sub-app "Família" APOSENTADO: a Central virou app único (raiz + seletor de visão).
     Esta página limpa o SW/caches antigos desta pasta e leva pra visão certa. */
  (function () {
    var DEST = "../index.html?v=FAMILIA";
    try {
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (rs) {
          rs.forEach(function (r) { r.unregister(); });
        });
      }
    } catch (e) {}
    try {
      if (window.caches && caches.keys) {
        caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
      }
    } catch (e) {}
    location.replace(DEST);
  })();
</script>
<meta http-equiv="refresh" content="1;url=../index.html?v=FAMILIA" />
</head>
