name: Sync Pluggy (Nubank/Inter PF/C6) → Supabase

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY_RUN (true = só simula, false = grava)"
        required: false
        default: "true"
      discover:
        description: "DISCOVER (true = só lista accounts/saldos + contas do app pra mapear conta_id)"
        required: false
        default: "false"
      item_ids:
        description: "item_ids avulsos (vírgula) — com DISCOVER, dispensa pluggy_conexoes"
        required: false
        default: ""
      mapping:
        description: "MAPPING JSON [{item_id,conta_id,visao,banco}] — só grava pluggy_conexoes e sai"
        required: false
        default: ""
      sync_days:
        description: "Quantos dias pra trás (7 = padrão seguro; janela grande reprocessa muita base)"
        required: false
        default: "7"
      probe_days:
        description: "PROBE (>0 = só lista movimentos recentes do app e sai)"
        required: false
        default: "0"
      force_refresh:
        description: "FORCE_REFRESH (true = força PATCH /items agora; padrão só lê o refresh diário)"
        required: false
        default: "true"
  # Piloto automático LIGADO: cron diário às 08h40 BRT (só leitura). Secrets PLUGGY_* já
  # cadastrados. O GitHub só dispara schedule a partir da branch DEFAULT (main),
  # então este cron só passa a rodar sozinho depois que a branch for mergeada.
  # O cron NAO forca PATCH (le o refresh diario do MeuPluggy); run manual forca;
  # janela padrão de 7 dias + dedup por hash = sem duplicata em reexecuções.
  schedule:
    # 06/09: 1x/dia. O MeuPluggy grátis tem teto mensal de requisicoes; rodar de
    # 2 em 2h FORCANDO refresh estourava o teto e o item travava ("toda hora
    # conectando"). Agora o cron so LE o refresh diario que o MeuPluggy ja faz
    # sozinho (sem PATCH). Pra forcar na hora, rode manual com force_refresh=true.
    - cron: "40 11 * * *"   # 11:40 UTC = 08:40 BRT, depois do refresh diario

# Nunca dois syncs ao mesmo tempo (cron + botão ⚡ do app podiam se cruzar).
concurrency:
  group: sync-pluggy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rodar sync Pluggy
        env:
          # --- Secrets (cadastre no GitHub a partir de dashboard.pluggy.ai) ---
          PLUGGY_CLIENT_ID: ${{ secrets.PLUGGY_CLIENT_ID }}
          PLUGGY_CLIENT_SECRET: ${{ secrets.PLUGGY_CLIENT_SECRET }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # --- Config não-sigilosa (fixa, igual aos outros syncs) ---
          SUPABASE_URL: https://mieqsiojvfiqrhectquc.supabase.co
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          DISCOVER: ${{ github.event.inputs.discover || 'false' }}
          ITEM_IDS: ${{ github.event.inputs.item_ids || '' }}
          MAPPING: ${{ github.event.inputs.mapping || '' }}
          SYNC_DAYS: ${{ github.event.inputs.sync_days || '7' }}
          PROBE_DAYS: ${{ github.event.inputs.probe_days || '0' }}
          FORCE_REFRESH: ${{ github.event.inputs.force_refresh || 'false' }}
        run: node scripts/sync-pluggy.mjs
